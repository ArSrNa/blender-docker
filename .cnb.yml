$:
  vscode:
    - docker:
        # dockerfile: .ide/Dockerfile
        image: docker.cnb.cool/arsrna/blender-docker/blender:4.5.11
      runner:
        tags: cnb:arch:amd64:gpu
      services:
        - vscode
        - docker
      env:
        CNB_WELCOME_CMD: "./start.sh"
      # stages:
      #   - name: setup GPU
      #     script: bash .ide/nvidia-graphics-setup.sh

"**":
  push:
    sync_to_github:
      runner:
        cpus: 2
      services:
        - docker
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          imports:
            - https://cnb.cool/arsrna/env/-/blob/main/git.yaml
          settings:
            target_url: https://github.com/ArSrNa/blender-docker
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            git_email: "root@arsrna.cn"
            force: true

"build/*":
  vscode:
    - runner:
        tags: cnb:arch:amd64:gpu
      services:
        - docker
        - vscode

"test/*":
  vscode:
    - runner:
        cpus: 32
      services:
        - docker
        - vscode

demo:
  vscode:
    - docker:
        image: docker.cnb.cool/arsrna/blender-docker/blender:4.5.11-test
      runner:
        tags: cnb:arch:amd64:gpu
      services:
        - vscode
        - docker
      env:
        CNB_WELCOME_CMD: "./start.sh"

master:
  tag_push:
    - services:
        - docker
      env:
        BLENDER_MAJOR: 4.5
        BLENDER_VERSION: 4.5.11
      stages:
        - name: docker build
          script: |
            docker build \
            --build-arg BLENDER_MAJOR=${BLENDER_MAJOR} \
            --build-arg BLENDER_VERSION=${BLENDER_VERSION} \
            -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/blender:${BLENDER_VERSION} -f .ide/Dockerfile .
        - name: docker push
          script: docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/blender:${BLENDER_VERSION}
