$:

  # --- 渲染 NPC：在 Issue / PR 评论中 @<repo>(渲染姬) 触发 ---
  # 环境用本仓库自建的 blender 镜像；GPU 节点 tags 为 cnb:arch:amd64:gpu，
  # 若调度到无 GPU 的节点，render.sh 会自动回退 CYCLES + CPU。
  issue.comment@npc:
    - docker:
        image: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/blender:4.5.11
      runner:
        tags: cnb:arch:amd64:gpu
      env:
        RENDER_OUTDIR: /workspace/output
      stages:
        - name: npc go
          type: npc:go

  pull_request.comment@npc:
    - docker:
        image: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/blender:4.5.11
      runner:
        tags: cnb:arch:amd64:gpu
      env:
        RENDER_OUTDIR: /workspace/output
      stages:
        - name: npc go
          type: npc:go

  # 页面按钮手动触发渲染，无需写评论（按钮定义见 .cnb/web_trigger.yml）
  web_trigger_render:
    - docker:
        image: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/blender:4.5.11
      runner:
        tags: cnb:arch:amd64:gpu
      env:
        RENDER_OUTDIR: /workspace/output
      stages:
        - name: npc go
          type: npc:go
          options:
            role: 渲染姬
            systemPrompt: |
              你是「渲染姬」，本仓库的 Blender 渲染助手。
              按 blender-render skill 执行用户要求的渲染任务，先小样验证再出正式图。
            userPrompt: $userPrompt

  vscode:
    - docker:
        # dockerfile: .ide/Dockerfile
        image: docker.cnb.cool/arsrna/blender-docker/blender:4.5.11
      runner:
        tags: cnb:arch:amd64:gpu
      services:
        - vscode
        - docker
      env:
        CNB_WELCOME_CMD: "./start.sh"
      # stages:
      #   - name: setup GPU
      #     script: bash .ide/nvidia-graphics-setup.sh

"build/*":
  vscode:
    - runner:
        tags: cnb:arch:amd64:gpu
      services:
        - docker
        - vscode

"test/*":
  vscode:
    - runner:
        cpus: 32
      services:
        - docker
        - vscode

demo:
  vscode:
    - docker:
        image: docker.cnb.cool/arsrna/blender-docker/blender:4.5.11-test
      runner:
        tags: cnb:arch:amd64:gpu
      services:
        - vscode
        - docker
      env:
        CNB_WELCOME_CMD: "./start.sh"

master:
  tag_push:
    - services:
        - docker
      env:
        BLENDER_MAJOR: 4.5
        BLENDER_VERSION: 4.5.11
      stages:
        - name: docker build
          script: |
            docker build \
            --build-arg BLENDER_MAJOR=${BLENDER_MAJOR} \
            --build-arg BLENDER_VERSION=${BLENDER_VERSION} \
            -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/blender:${BLENDER_VERSION} -f .ide/Dockerfile .
        - name: docker push
          script: docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/blender:${BLENDER_VERSION}
