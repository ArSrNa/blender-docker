master:
  vscode:
    - docker:
        build: .ide/Dockerfile
      runner:
        tags: cnb:arch:amd64:gpu
        cpus: 24
      services:
        - vscode
        - docker
      env:
        CNB_WELCOME_EXECUTE_COMMAND: "./arrm/arrm_server"
      stages:
        - name: 启动控制端
          script: "nohup ./arrm/arrm_control >/dev/null &"